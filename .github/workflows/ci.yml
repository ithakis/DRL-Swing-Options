name: CI

on:
  push:
    branches: [main, "chore/**", "refactor/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check src/ tools/ run.py evaluate_saved_agent.py"
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check src/ tools/ run.py evaluate_saved_agent.py"

  test:
    name: tests + v64 smoke
    runs-on: ubuntu-latest
    needs: lint           # don't burn GPU/conda time if lint already fails
    defaults:
      run:
        shell: bash -el {0}   # login shell so `conda activate` works
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda env (EP11) with cache
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: EP11
          miniforge-version: latest
          use-mamba: true
          cache-environment: true          # cache the solved env by environment.yml hash
          cache-environment-key: conda-${{ runner.os }}-${{ hashFiles('environment.yml') }}

      - name: Show environment
        run: |
          python --version
          python -c "import torch, numpy, numba, gymnasium; print('torch', torch.__version__)"

      - name: Import smoke — all src/ modules
        run: pytest tools/test_imports.py -q

      - name: v64 defaults regression guard
        run: pytest tools/test_config.py -q

      - name: Unit tests (greeks)
        run: pytest tools/test_greeks.py -q

      - name: v64 default training smoke (no flags = v64 focal recipe)
        run: |
          python run.py -n_paths 1100 -n_paths_eval 256 -eval_every -1 \
            -name ci_v64_smoke -seed 0 --disable_csv_logging 1 --limit_logging_frequency 1
          test -f runs/ci_v64_smoke.pth && echo "v64 smoke trained + saved OK"
